name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Create virtual environment
        run: uv venv --python "${{ matrix.python-version }}" .venv
      - name: Install current Amplifier sources and test runner dependencies
        run: |
          uv pip install --no-config --python .venv/bin/python \
            "amplifier-core @ git+https://github.com/microsoft/amplifier-core@main" \
            "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main" \
            "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main" \
            "pytest==9.0.3" \
            "pytest-asyncio==1.3.0"
          uv pip install --no-config --no-deps --python .venv/bin/python .
      - name: Run full test suite, including TestProgressRecovery
        run: .venv/bin/python -m pytest tests -v
